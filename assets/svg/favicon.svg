<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Fond dark Obsidian -->
  <rect width="32" height="32" rx="6" fill="#0c0e14"/>

  <!-- Flocon stylisé (léger, en arrière-plan) -->
  <g stroke="#c8102e" stroke-width="0.8" opacity="0.35" stroke-linecap="round">
    <!-- axe vertical -->
    <line x1="16" y1="4" x2="16" y2="28"/>
    <!-- axe horizontal -->
    <line x1="4" y1="16" x2="28" y2="16"/>
    <!-- axe diagonal \ -->
    <line x1="7.5" y1="7.5" x2="24.5" y2="24.5"/>
    <!-- axe diagonal / -->
    <line x1="24.5" y1="7.5" x2="7.5" y2="24.5"/>
    <!-- branches axe vertical -->
    <line x1="13" y1="8" x2="16" y2="4"/><line x1="19" y1="8" x2="16" y2="4"/>
    <line x1="13" y1="24" x2="16" y2="28"/><line x1="19" y1="24" x2="16" y2="28"/>
    <!-- branches axe horizontal -->
    <line x1="8" y1="13" x2="4" y2="16"/><line x1="8" y1="19" x2="4" y2="16"/>
    <line x1="24" y1="13" x2="28" y2="16"/><line x1="24" y1="19" x2="28" y2="16"/>
  </g>

  <!-- Z italic Cormorant-style -->
  <text
    x="16" y="22"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="18"
    font-style="italic"
    font-weight="300"
    fill="#f0eee8"
    text-anchor="middle"
    letter-spacing="0.05em"
  >Z</text>

  <!-- Point accent rouge -->
  <circle cx="21.5" cy="20" r="1.8" fill="#c8102e"/>
</svg>
