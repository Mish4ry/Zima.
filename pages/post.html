<!doctype html>
<html lang="fr" data-theme="obsidian">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Zima. — Poster</title>
    <link rel="stylesheet" href="../css/themes.css" />
    <link rel="stylesheet" href="../css/post.css" />
    <link rel="icon" type="image/svg+xml" href="../assets//svg/favicon.svg" />
    <link rel="icon" type="image/x-icon" href="../assets//ico/favicon.ico" />
    <link rel="apple-touch-icon" href="../assets//images/favicon-180.png" />
    <script src="../js/theme.js"></script>
  </head>
  <body>
    <nav class="navbar">
      <a href="feed.html" class="nav-logo"><em>Z</em>ima.</a>
      <div class="nav-links">
        <a href="feed.html">Feed</a>
        <a href="explore.html">Explorer</a>
        <a href="post.html" class="active">Poster</a>
        <a href="profil.html">Profil</a>
        <a href="parametres.html">Paramètres</a>
      </div>
    </nav>

    <main class="post-container">
      <header class="post-header">
        <h1>Nouveau post</h1>
        <p>Partage ta passion avec la communauté.</p>
      </header>

      <form class="post-form">
        <div class="post-type">
          <button type="button" class="type-btn active" data-type="text">
            <svg
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.5"
            >
              <path
                d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"
              />
              <polyline points="14 2 14 8 20 8" />
              <line x1="16" y1="13" x2="8" y2="13" />
              <line x1="16" y1="17" x2="8" y2="17" />
            </svg>
            <span>Texte</span>
          </button>
          <button type="button" class="type-btn" data-type="photo">
            <svg
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.5"
            >
              <rect x="3" y="3" width="18" height="18" rx="2" ry="2" />
              <circle cx="8.5" cy="8.5" r="1.5" />
              <polyline points="21 15 16 10 5 21" />
            </svg>
            <span>Photo</span>
          </button>
          <button type="button" class="type-btn" data-type="video">
            <svg
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.5"
            >
              <polygon points="23 7 16 12 23 17 23 7" />
              <rect x="1" y="5" width="15" height="14" rx="2" ry="2" />
            </svg>
            <span>Vidéo</span>
          </button>
        </div>

        <div class="field">
          <label for="content">Contenu</label>
          <textarea
            id="content"
            placeholder="Écris ton message..."
            rows="6"
          ></textarea>
        </div>

        <div class="upload-zone" id="uploadZone" style="display: none">
          <div class="upload-content">
            <svg
              width="32"
              height="32"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1"
            >
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
              <polyline points="17 8 12 3 7 8" />
              <line x1="12" y1="3" x2="12" y2="15" />
            </svg>
            <p>Glisse ton fichier ici</p>
            <span>ou clique pour sélectionner</span>
          </div>
          <input type="file" id="fileInput" accept="image/*,video/*" />
        </div>

        <div class="field">
          <label for="tags">Tags</label>
          <input
            type="text"
            id="tags"
            placeholder="ex: axel, spin, compétition"
          />
        </div>

        <button type="submit" class="btn-primary">Publier</button>
      </form>
    </main>

    <script src="../js/post.js"></script>
  </body>
</html>
