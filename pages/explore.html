      <header class="explore-header">
        <h1>Explorer</h1>
        <p>Tous les patineurs, dans l'ordre alphabétique.</p>

      <div class="search-bar">
        <svg
          class="search-icon"
          width="18"
          height="18"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.5"
        >
          <circle cx="11" cy="11" r="8" />
          <path d="M21 21l-4.35-4.35" />
        </svg>
        <input
          type="text"
          placeholder="Rechercher un patineur..."
          id="search"
        />
      </div>

      <section class="accounts-list">
        <div class="letter-group">
          <h2 class="letter">A</h2>
          <a href="profil.html" class="account-card">
            <div class="account-avatar"></div>
            <div class="account-info">
              <span class="account-name">Alina Zagitova</span>
              <span class="account-level">Compétiteur</span>
            </div>
          </a>
          <a href="profil.html" class="account-card">
            <div class="account-avatar"></div>
            <div class="account-info">
              <span class="account-name">Anna Shcherbakova</span>

            </div>

        <div class="letter-group">

          <a href="profil.html" class="account-card">

              <span class="account-name">Nathan Chen</span>

            </div>
          </a>
        </div>

        <div class="letter-group">
          <h2 class="letter">Y</h2>
          <a href="profil.html" class="account-card">
            <div class="account-avatar"></div>
            <div class="account-info">
              <span class="account-name">Yuna Kim</span>
              <span class="account-level badge">Influenceur</span>
            </div>
